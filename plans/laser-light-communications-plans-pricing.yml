note: >-
  Laser Light Communications publishes no plans, tiers, list prices or rate card. The whole public
  site is four pages (/, /learn/, /insights/, /sample-page/ per the Yoast sitemap) and there is no
  /pricing page — probes of /pricing, /plans and /contact all 404. The two commercial services,
  Data Transport as a Service and Network on Demand, are described in downloadable datasheets
  (LL_Data_Sheet_DTAAS-4-6-22-1.pdf, LL_Data_Sheet_NOD-4-6-22.pdf, both HTTP 200) that state a
  consumption/subscription model — "only paying for the volume they transport" — but name no unit
  price, no committed-rate tiers and no minimums. Acquisition is a contact form addressed to
  "Customers, Partners, Media, and Investors"; this is an enterprise, contract-negotiated
  wholesale capacity business with no self-serve pricing surface.
